<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golden Ledger">
<meta name="theme-color" content="#1C1815">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Golden Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1C1815;
  --ink-light: #2E2722;
  --paper: #FAF6EE;
  --paper-warm: #F2EBDA;
  --gold: #C9A24B;
  --gold-bright: #E8C468;
  --gold-pale: #F5EBD2;
  --gold-deep: #8A6D2F;
  --emerald: #4A7862;
  --emerald-pale: #E3EEE8;
  --rose: #B5564A;
  --rose-pale: #F5E2DF;
  --text: #2A2420;
  --text-mid: #6E6356;
  --text-light: #A89B86;
  --border: #E3D9C2;
  --white: #FFFEFB;
  --radius: 18px;
  --radius-sm: 11px;
  --shadow: 0 2px 18px rgba(28,24,21,0.08);
  --shadow-lg: 0 10px 40px rgba(28,24,21,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle at 10% 10%, rgba(201,162,75,0.06) 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(74,120,98,0.04) 0%, transparent 40%);
}

/* ── NAV ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(28,24,21,0.97);
  backdrop-filter: blur(14px);
  padding-top: env(safe-area-inset-top, 0);
  border-bottom: 1px solid rgba(201,162,75,0.25);
}
.nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px; max-width: 560px; margin: 0 auto;
}
.nav-brand { display: flex; align-items: center; gap: 10px; }
.nav-mark { font-size: 20px; color: var(--gold-bright); }
.nav-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--paper); letter-spacing: 0.02em; }
.nav-sub { font-size: 9px; color: var(--gold); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 1px; }
.month-pill {
  background: var(--gold); color: var(--ink);
  border: none; border-radius: 20px; padding: 7px 16px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
  font-family: 'DM Sans', sans-serif; cursor: pointer;
}

/* ── TABS ── */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(28,24,21,0.98);
  backdrop-filter: blur(14px);
  border-top: 1px solid rgba(201,162,75,0.25);
  display: flex; overflow-x: auto;
  padding-bottom: env(safe-area-inset-bottom, 0);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; min-width: 64px; border: none; background: none; cursor: pointer;
  padding: 9px 2px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: rgba(245,235,210,0.45); font-family: 'DM Sans', sans-serif;
  font-size: 9px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  transition: color 0.2s;
}
.tab-btn.active { color: var(--gold-bright); }
.tab-btn .tab-icon { font-size: 19px; line-height: 1; }

/* ── SCREENS ── */
.screen { display: none; padding: 78px 16px 92px; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
.screen.active { display: block; }

.section-label {
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-light); font-weight: 700;
  margin-bottom: 11px; margin-top: 26px;
  display: flex; align-items: center; gap: 8px;
}
.section-label:first-child { margin-top: 0; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── CARDS ── */
.card {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 18px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}
.card-title { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.card-sub { font-size: 12px; color: var(--text-mid); line-height: 1.5; margin-bottom: 14px; }

/* ── HERO ── */
.hero-card {
  background: linear-gradient(145deg, #1C1815 0%, #322A22 100%);
  border-radius: var(--radius); padding: 24px 22px; margin-bottom: 14px;
  box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
  border: 1px solid rgba(201,162,75,0.3);
}
.hero-card::before {
  content: '✦'; position: absolute; top: 14px; right: 18px;
  font-size: 22px; color: rgba(201,162,75,0.35);
}
.hero-eyebrow { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; font-weight: 700; }
.hero-amount { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 700; color: var(--paper); line-height: 1; }
.hero-amount.negative { color: #D98E84; }
.hero-amount-label { font-size: 12px; color: rgba(245,235,210,0.55); margin-top: 4px; }
.hero-stat-row { display: flex; gap: 22px; margin-top: 18px; }
.hero-stat { flex: 1; }
.hero-stat-val { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--paper); }
.hero-stat-lbl { font-size: 10px; color: rgba(245,235,210,0.5); margin-top: 2px; letter-spacing: 0.03em; }

/* ── INPUT FIELDS ── */
.field-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.field-row:last-child { border-bottom: none; }
.field-name { flex: 1; font-size: 13px; color: var(--text); }
.field-input {
  width: 100px; text-align: right;
  border: 1.5px solid var(--border); border-radius: 8px;
  padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px;
  color: var(--gold-deep); font-weight: 600; background: var(--paper);
  transition: border-color 0.2s;
}
.field-input:focus { outline: none; border-color: var(--gold); }
.field-input.actual { color: var(--emerald); }
.field-variance { width: 70px; text-align: right; font-size: 12px; font-weight: 600; }
.field-variance.over { color: var(--rose); }
.field-variance.under { color: var(--emerald); }

input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 11px 13px; font-family: 'DM Sans', sans-serif; font-size: 14px;
  color: var(--text); background: var(--paper);
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
input::placeholder { color: var(--text-light); }

.field-label { font-size: 11px; color: var(--text-mid); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.02em; }
.field-wrap { margin-bottom: 14px; }

.save-btn {
  width: 100%; padding: 14px; border-radius: var(--radius-sm);
  background: var(--ink); border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  color: var(--gold-bright); margin-top: 4px; transition: opacity 0.2s;
  letter-spacing: 0.02em;
}
.save-btn:active { opacity: 0.85; }
.add-btn {
  width: 100%; padding: 12px; border-radius: var(--radius-sm);
  background: var(--gold-pale); border: 1.5px dashed var(--gold); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  color: var(--gold-deep); margin-top: 8px;
}

/* ── CATEGORY GROUPS (Monthly Budget) ── */
.cat-group { margin-bottom: 18px; }
.cat-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-size: 12px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em;
}
.cat-emoji { font-size: 15px; }
.cat-total { margin-left: auto; font-size: 12px; color: var(--gold-deep); font-weight: 700; }
.line-item {
  display: grid; grid-template-columns: 1fr 70px 70px 60px 22px; gap: 6px; align-items: center;
  padding: 7px 0; border-bottom: 1px solid var(--border);
}
.line-item:last-child { border-bottom: none; }
.li-name { font-size: 12.5px; color: var(--text); }
.li-input {
  border: 1.5px solid var(--border); border-radius: 7px; padding: 5px 6px;
  font-size: 12px; text-align: right; font-family: 'DM Sans', sans-serif;
  background: var(--paper); color: var(--text);
}
.li-input:focus { outline: none; border-color: var(--gold); }
.li-var { font-size: 11px; font-weight: 700; text-align: right; }
.li-var.over { color: var(--rose); }
.li-var.under { color: var(--emerald); }
.li-del { background: none; border: none; color: var(--text-light); font-size: 14px; cursor: pointer; }
.col-header { font-size: 9px; color: var(--text-light); text-transform: uppercase; text-align: right; font-weight: 700; }

.line-item-simple {
  display: grid; grid-template-columns: 1fr 90px 22px; gap: 8px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.line-item-simple:last-child { border-bottom: none; }
.li-input-simple {
  border: 1.5px solid var(--border); border-radius: 7px; padding: 6px 8px;
  font-size: 13px; text-align: right; font-family: 'DM Sans', sans-serif;
  background: var(--paper); color: var(--gold-deep); font-weight: 600;
}
.li-input-simple:focus { outline: none; border-color: var(--gold); }

/* ── SUMMARY ROW ── */
.summary-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-top: 2px solid var(--ink);
  margin-top: 6px;
}
.summary-label { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700; color: var(--text); }
.summary-val { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--gold-deep); }
.summary-val.negative { color: var(--rose); }

/* ── ANNUAL TABLE ── */
.annual-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.annual-tbl { border-collapse: collapse; min-width: 700px; }
.annual-tbl th {
  font-size: 10px; color: var(--text-light); font-weight: 700; text-transform: uppercase;
  padding: 6px 8px; text-align: right; border-bottom: 2px solid var(--ink);
}
.annual-tbl th:first-child { text-align: left; }
.annual-tbl td {
  font-size: 12px; padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border);
  color: var(--text);
}
.annual-tbl td:first-child { text-align: left; font-weight: 600; }
.annual-tbl tr.total-row td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: none; color: var(--gold-deep); }
.annual-tbl td.total-col { font-weight: 700; background: var(--gold-pale); }

/* ── SAVINGS GOALS ── */
.goal-card { margin-bottom: 12px; }
.goal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.goal-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--text); }
.goal-pct { font-size: 13px; font-weight: 700; color: var(--gold-deep); }
.progress-track { background: var(--paper-warm); border-radius: 8px; height: 10px; overflow: hidden; margin-bottom: 10px; }
.progress-fill { height: 10px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 100%); border-radius: 8px; transition: width 0.5s ease; }
.progress-fill.complete { background: linear-gradient(90deg, var(--emerald) 0%, #5E9A7F 100%); }
.goal-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.goal-input-wrap .field-label { font-size: 10px; margin-bottom: 3px; }
.goal-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-mid); }
.goal-complete-badge {
  background: var(--emerald-pale); color: var(--emerald); border-radius: 20px;
  padding: 4px 12px; font-size: 11px; font-weight: 700; display: inline-block;
}

/* ── DEBT TRACKER ── */
.strategy-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
.strategy-btn {
  flex: 1; padding: 11px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  background: var(--white); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-mid);
  text-align: center;
}
.strategy-btn.active { background: var(--ink); color: var(--gold-bright); border-color: var(--ink); }
.debt-card { margin-bottom: 10px; position: relative; }
.debt-rank {
  position: absolute; top: -8px; left: 14px;
  background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 700;
  width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.debt-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; margin-top: 4px; }
.debt-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.debt-payoff-badge {
  display: inline-block; border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 700;
}
.debt-payoff-badge.paid { background: var(--emerald-pale); color: var(--emerald); }
.debt-payoff-badge.warn { background: var(--rose-pale); color: var(--rose); }
.debt-payoff-badge.normal { background: var(--gold-pale); color: var(--gold-deep); }

/* ── BILL CALENDAR ── */
.bill-row {
  display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border);
}
.bill-row:last-child { border-bottom: none; }
.bill-status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.bill-status-dot.unpaid { background: var(--rose); }
.bill-status-dot.pending { background: var(--gold); }
.bill-status-dot.paid { background: var(--emerald); }
.bill-info { flex: 1; }
.bill-name-txt { font-size: 13.5px; font-weight: 600; color: var(--text); }
.bill-meta-txt { font-size: 11px; color: var(--text-mid); margin-top: 1px; }
.debt-link-tag {
  display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 600;
  color: var(--gold-deep); background: var(--gold-pale); border-radius: 12px;
  padding: 3px 9px;
}
.bill-amt { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
.bill-status-toggle {
  font-size: 10px; padding: 4px 10px; border-radius: 14px; border: none; cursor: pointer;
  font-weight: 700; text-transform: uppercase;
}
.bill-status-toggle.unpaid { background: var(--rose-pale); color: var(--rose); }
.bill-status-toggle.paid { background: var(--emerald-pale); color: var(--emerald); }
.alert-banner {
  background: var(--rose-pale); border: 1px solid #E0B8B2; border-radius: var(--radius-sm);
  padding: 12px 16px; margin-bottom: 14px; font-size: 13px; color: var(--rose); font-weight: 600;
}
.alert-banner.calm { background: var(--emerald-pale); border-color: #BFDCCB; color: var(--emerald); }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(28,24,21,0.55); align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--white); border-radius: var(--radius) var(--radius) 0 0;
  padding: 26px 20px 36px; width: 100%; max-width: 560px; max-height: 84vh; overflow-y: auto;
}
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--text-mid); line-height: 1.5; margin-bottom: 18px; }
.modal-btns { display: flex; gap: 10px; margin-top: 18px; }
.modal-cancel {
  flex: 1; padding: 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  background: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-mid);
}
.modal-confirm {
  flex: 1; padding: 13px; border-radius: var(--radius-sm); border: none;
  background: var(--rose); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: white;
}

/* ── DASHBOARD ── */
.snapshot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.snap-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; box-shadow: var(--shadow); }
.snap-label { font-size: 10px; color: var(--text-light); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.snap-val { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; color: var(--text); margin-top: 3px; }
.snap-val.gold { color: var(--gold-deep); }
.snap-val.emerald { color: var(--emerald); }
.snap-val.rose { color: var(--rose); }
.mini-list-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px;
}
.mini-list-row:last-child { border-bottom: none; }
.mini-list-name { color: var(--text); font-weight: 500; }
.mini-list-val { color: var(--text-mid); font-weight: 600; }

/* ── SETTINGS ── */
.reset-btn {
  width: 100%; padding: 13px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--white); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500;
  color: var(--text-mid); margin-bottom: 9px; transition: all 0.2s; text-align: left;
  box-shadow: var(--shadow);
}
.reset-btn.danger { border-color: var(--rose-pale); background: var(--rose-pale); color: var(--rose); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--gold-bright); border-radius: 20px;
  padding: 10px 22px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
  white-space: nowrap; z-index: 300; letter-spacing: 0.02em;
}
.toast.show { opacity: 1; }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 30px 16px; color: var(--text-light); font-size: 13px; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-mark">✦</div>
      <div>
        <div class="nav-title">Golden Ledger</div>
        <div class="nav-sub">Personal Treasury</div>
      </div>
    </div>
    <button class="month-pill" id="nav-month-pill" onclick="showScreen('dashboard')">January</button>
  </div>
</div>

<!-- placeholder for screens, injected in part 2 -->
<div id="screens-root"></div>

<div class="tabs" id="tabs-root"></div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-body"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" id="modal-confirm-btn" onclick="doModal()">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════ DATA MODEL ════════════════════ */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const INCOME_CATS = ['Primary Salary / Wages','Secondary Job / Side Gig','Freelance / Contract Work','Rental Income','Investment Dividends','Other Income'];

const EXPENSE_GROUPS = [
  { key: 'HOUSING', emoji: '🏠', items: ['Rent / Mortgage','Electricity','Gas / Heating','Water & Sewer','Internet','Phone','Home Insurance','HOA / Other'] },
  { key: 'TRANSPORT', emoji: '🚗', items: ['Car Payment','Fuel / Gas','Auto Insurance','Parking / Tolls','Public Transit','Maintenance'] },
  { key: 'FOOD', emoji: '🛒', items: ['Groceries','Dining Out / Takeout','Coffee / Drinks','Work Lunches'] },
  { key: 'HEALTH', emoji: '🩺', items: ['Health Insurance','Gym / Fitness','Prescriptions','Doctor Visits'] },
  { key: 'LIFESTYLE', emoji: '🎭', items: ['Streaming Services','Entertainment','Clothing','Hobbies','Personal Care','Gifts'] },
  { key: 'EDUCATION', emoji: '📚', items: ['Student Loan Payment','Courses / Books','Kids School'] },
  { key: 'FINANCIAL', emoji: '💼', items: ['Savings Transfer','Investments','Life Insurance','Misc / Other'] },
];

const DEFAULT_GOALS = ['Emergency Fund (3-6 months)','Vacation / Travel','Down Payment','New Car','Holiday / Gifts','Education / Course','Home Improvement'];
const DEFAULT_DEBTS = ['Credit Card #1','Credit Card #2','Student Loan','Car Loan','Personal Loan','Medical Bill'];
const DEFAULT_BILLS = [
  ['Rent / Mortgage','Housing'],['Electric Bill','Utilities'],['Internet','Utilities'],['Phone Bill','Utilities'],
  ['Car Insurance','Insurance'],['Streaming Services','Subscriptions'],['Credit Card #1','Loans'],['Credit Card #2','Loans'],
  ['Student Loan','Loans'],['Gym Membership','Other']
];

let state = {};
let currentMonthIdx = new Date().getMonth();
let currentStrategy = 'avalanche';
let pendingModal = '';
let modalCtx = null;

function load() {
  try { state = JSON.parse(localStorage.getItem('golden_ledger') || '{}'); } catch(e) { state = {}; }
  if (!state.months) state.months = {};
  MONTHS.forEach(m => {
    if (!state.months[m]) state.months[m] = { income: {}, expenses: {} };
    if (!state.months[m].income) state.months[m].income = {};
    if (!state.months[m].expenses) state.months[m].expenses = {};
  });
  if (!state.goals) state.goals = DEFAULT_GOALS.map(name => ({ name, target: 0, saved: 0, contribution: 0 }));
  if (!state.debts) state.debts = DEFAULT_DEBTS.map(name => ({ name, balance: 0, apr: 0, minPayment: 0, extraPayment: 0 }));
  if (!state.bills) state.bills = DEFAULT_BILLS.map(([name, cat]) => ({ name, amount: 0, frequency: 'Monthly', dueDate: new Date().toISOString().slice(0,10), category: cat, autopay: false, status: 'unpaid' }));
  if (!state.strategy) state.strategy = 'avalanche';
  if (state.currentMonthIdx == null) state.currentMonthIdx = new Date().getMonth();
  currentMonthIdx = state.currentMonthIdx;
  currentStrategy = state.strategy;
}
function save() { state.currentMonthIdx = currentMonthIdx; state.strategy = currentStrategy; localStorage.setItem('golden_ledger', JSON.stringify(state)); }

function fmt(n) {
  n = Number(n) || 0;
  const neg = n < 0;
  const abs = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  return (neg ? '-$' : '$') + abs;
}
function fmtPct(n) { return (Number(n) * 100).toFixed(0) + '%'; }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'dashboard') renderDashboard();
  if (name === 'budget') renderBudget();
  if (name === 'annual') renderAnnual();
  if (name === 'goals') renderGoals();
  if (name === 'debt') renderDebt();
  if (name === 'bills') renderBills();
  if (name === 'settings') renderSettings();
}

function changeMonth(delta) {
  currentMonthIdx = (currentMonthIdx + delta + 12) % 12;
  save();
  document.getElementById('nav-month-pill').textContent = MONTH_NAMES[currentMonthIdx];
  const active = document.querySelector('.screen.active').id.replace('screen-', '');
  showScreen(active);
}

/* ════════════════════ MONTHLY BUDGET CALCULATIONS ════════════════════ */
function monthData(idx) { return state.months[MONTHS[idx]]; }

function monthTotalIncome(idx) {
  const m = monthData(idx);
  return INCOME_CATS.reduce((a, c) => a + (Number(m.income[c]) || 0), 0);
}
function monthGroupActual(idx, groupKey) {
  const m = monthData(idx);
  const group = EXPENSE_GROUPS.find(g => g.key === groupKey);
  return group.items.reduce((a, item) => a + (Number(m.expenses[groupKey + '::' + item]) || 0), 0);
}
function monthTotalExpensesActual(idx) {
  return EXPENSE_GROUPS.reduce((a, g) => a + monthGroupActual(idx, g.key), 0);
}
function monthNetCashFlow(idx) { return monthTotalIncome(idx) - monthTotalExpensesActual(idx); }
function monthSavingsRate(idx) {
  const inc = monthTotalIncome(idx);
  return inc > 0 ? monthNetCashFlow(idx) / inc : 0;
}

/* ════════════════════ DASHBOARD ════════════════════ */
function renderDashboard() {
  document.getElementById('nav-month-pill').textContent = MONTH_NAMES[currentMonthIdx];
  const idx = currentMonthIdx;
  const inc = monthTotalIncome(idx);
  const expA = monthTotalExpensesActual(idx);
  const net = monthNetCashFlow(idx);
  const rate = monthSavingsRate(idx);

  let ytdIncome = 0, ytdExpenses = 0;
  let bestMonth = '—', bestRate = -Infinity;
  for (let i = 0; i < 12; i++) {
    const mi = monthTotalIncome(i), me = monthTotalExpensesActual(i);
    ytdIncome += mi; ytdExpenses += me;
    const r = monthSavingsRate(i);
    if (mi > 0 && r > bestRate) { bestRate = r; bestMonth = MONTHS[i]; }
  }
  const ytdNet = ytdIncome - ytdExpenses;

  const upcoming = [...state.bills]
    .filter(b => b.status !== 'paid')
    .sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate))
    .slice(0, 5);

  const screen = document.getElementById('screen-dashboard');
  screen.innerHTML = `
    <div class="hero-card">
      <div class="hero-eyebrow">${MONTH_NAMES[idx]} · Net Cash Flow</div>
      <div class="hero-amount ${net < 0 ? 'negative' : ''}">${fmt(net)}</div>
      <div class="hero-amount-label">${rate >= 0 ? fmtPct(rate) + ' savings rate' : 'spending exceeds income'}</div>
      <div class="hero-stat-row">
        <div class="hero-stat"><div class="hero-stat-val">${fmt(inc)}</div><div class="hero-stat-lbl">Income</div></div>
        <div class="hero-stat"><div class="hero-stat-val">${fmt(expA)}</div><div class="hero-stat-lbl">Spent</div></div>
      </div>
    </div>

    <div class="section-label">Year to date</div>
    <div class="snapshot-grid">
      <div class="snap-card"><div class="snap-label">YTD Income</div><div class="snap-val gold">${fmt(ytdIncome)}</div></div>
      <div class="snap-card"><div class="snap-label">YTD Expenses</div><div class="snap-val">${fmt(ytdExpenses)}</div></div>
      <div class="snap-card"><div class="snap-label">YTD Net</div><div class="snap-val ${ytdNet < 0 ? 'rose' : 'emerald'}">${fmt(ytdNet)}</div></div>
      <div class="snap-card"><div class="snap-label">Best Month</div><div class="snap-val">${bestMonth}</div></div>
    </div>

    <div class="section-label">Goals &amp; debt</div>
    <div class="card">
      <div class="card-title" style="font-size:15px;">Top savings goals</div>
      <div id="dash-goals-mini"></div>
    </div>
    <div class="card">
      <div class="card-title" style="font-size:15px;">Active debts</div>
      <div id="dash-debt-mini"></div>
    </div>

    <div class="section-label">Upcoming bills</div>
    <div class="card">
      <div id="dash-bills-mini"></div>
    </div>
  `;

  const goalsMini = document.getElementById('dash-goals-mini');
  const topGoals = state.goals.filter(g => g.target > 0).slice(0,3);
  goalsMini.innerHTML = topGoals.length ? topGoals.map(g => {
    const pct = g.target > 0 ? Math.min(g.saved / g.target, 1) : 0;
    return `<div class="mini-list-row"><span class="mini-list-name">${g.name}</span><span class="mini-list-val">${fmtPct(pct)}</span></div>`;
  }).join('') : '<div class="empty-state">Set a savings goal target to see it here</div>';

  const debtMini = document.getElementById('dash-debt-mini');
  const activeDebts = state.debts.filter(d => d.balance > 0).slice(0,3);
  debtMini.innerHTML = activeDebts.length ? activeDebts.map(d =>
    `<div class="mini-list-row"><span class="mini-list-name">${d.name}</span><span class="mini-list-val">${fmt(d.balance)}</span></div>`
  ).join('') : '<div class="empty-state">No active debts — well done ✦</div>';

  const billsMini = document.getElementById('dash-bills-mini');
  billsMini.innerHTML = upcoming.length ? upcoming.map(b => {
    const d = new Date(b.dueDate);
    return `<div class="mini-list-row"><span class="mini-list-name">${b.name}</span><span class="mini-list-val">${fmt(b.amount)} · ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>`;
  }).join('') : '<div class="empty-state">All bills paid for now ✦</div>';
}

function MONTH_NAME_FULL(idx) { return MONTH_NAMES[idx]; }

function updateIncome(el) {
  const cat = el.dataset.cat;
  monthData(currentMonthIdx).income[cat] = el.value;
  save();
  refreshBudgetTotals();
}
function updateExpense(el) {
  const key = el.dataset.key;
  monthData(currentMonthIdx).expenses[key] = el.value;
  save();
  refreshBudgetTotals();
}

function refreshBudgetTotals() {
  const idx = currentMonthIdx;
  const inc = monthTotalIncome(idx);
  const expA = monthTotalExpensesActual(idx);
  const net = monthNetCashFlow(idx);
  const rate = monthSavingsRate(idx);

  // income total
  const incSummary = document.querySelector('#income-rows').parentElement.querySelector('.summary-val');
  if (incSummary) incSummary.textContent = fmt(inc);

  // expense group totals
  document.querySelectorAll('.cat-group').forEach(card => {
    const groupKey = card.dataset.group;
    if (!groupKey) return;
    const total = monthGroupActual(idx, groupKey);
    card.querySelector('.cat-total').textContent = fmt(total);
  });

  // bottom summary card (Total Expenses, Net Cash Flow, Savings Rate)
  const cards = document.querySelectorAll('.screen.active .card');
  const lastCard = cards[cards.length - 1];
  if (lastCard) {
    const rows = lastCard.querySelectorAll('.summary-val');
    if (rows[0]) rows[0].textContent = fmt(expA);
    if (rows[1]) { rows[1].textContent = fmt(net); rows[1].className = 'summary-val' + (net < 0 ? ' negative' : ''); }
    if (rows[2]) { rows[2].textContent = fmtPct(rate); rows[2].className = 'summary-val' + (rate < 0 ? ' negative' : ''); }
  }
}

function addCustomLineItem(groupKey) {
  const group = EXPENSE_GROUPS.find(g => g.key === groupKey);
  const name = prompt('New line item name:');
  if (!name || !name.trim()) return;
  if (!group.custom) group.custom = [];
  group.items.push(name.trim());
  group.custom.push(name.trim());
  renderBudget();
}
function deleteCustomLineItem(groupKey, itemName) {
  const group = EXPENSE_GROUPS.find(g => g.key === groupKey);
  if (!group.custom || !group.custom.includes(itemName)) return;
  group.items = group.items.filter(i => i !== itemName);
  group.custom = group.custom.filter(i => i !== itemName);
  MONTHS.forEach(mo => {
    delete state.months[mo].expenses[groupKey + '::' + itemName];
  });
  save();
  renderBudget();
}

/* ════════════════════ ANNUAL OVERVIEW ════════════════════ */
function renderAnnual() {
  document.getElementById('nav-month-pill').textContent = MONTH_NAME_FULL(currentMonthIdx);
  const incomeRow = MONTHS.map((_, i) => monthTotalIncome(i));
  const groupRows = EXPENSE_GROUPS.map(g => ({ key: g.key, vals: MONTHS.map((_, i) => monthGroupActual(i, g.key)) }));
  const expenseRow = MONTHS.map((_, i) => monthTotalExpensesActual(i));
  const netRow = MONTHS.map((_, i) => monthNetCashFlow(i));
  const rateRow = MONTHS.map((_, i) => monthSavingsRate(i));

  const sum = arr => arr.reduce((a,b) => a+b, 0);

  const screen = document.getElementById('screen-annual');
  screen.innerHTML = `
    <div class="section-label">Annual summary</div>
    <div class="card" style="padding:14px;">
      <p style="font-size:12px; color:var(--text-mid); margin-bottom:12px;">Auto-filled from your 12 monthly budgets — no entry needed here.</p>
      <div class="annual-scroll">
        <table class="annual-tbl">
          <tr><th>Category</th>${MONTHS.map(m => `<th>${m}</th>`).join('')}<th class="total-col">Total</th></tr>
          <tr><td>💰 Income</td>${incomeRow.map(v => `<td>${fmt(v)}</td>`).join('')}<td class="total-col">${fmt(sum(incomeRow))}</td></tr>
          ${groupRows.map(g => `<tr><td>${g.key}</td>${g.vals.map(v => `<td>${fmt(v)}</td>`).join('')}<td class="total-col">${fmt(sum(g.vals))}</td></tr>`).join('')}
          <tr class="total-row"><td>Total Expenses</td>${expenseRow.map(v => `<td>${fmt(v)}</td>`).join('')}<td class="total-col">${fmt(sum(expenseRow))}</td></tr>
          <tr class="total-row"><td>Net Cash Flow</td>${netRow.map(v => `<td>${fmt(v)}</td>`).join('')}<td class="total-col">${fmt(sum(netRow))}</td></tr>
          <tr><td>Savings Rate</td>${rateRow.map(v => `<td>${fmtPct(v)}</td>`).join('')}<td class="total-col">${fmtPct(ytdRateHelper())}</td></tr>
        </table>
      </div>
    </div>
  `;
  function ytdRateHelper() {
    const ti = sum(incomeRow), te = sum(expenseRow);
    return ti > 0 ? (ti - te) / ti : 0;
  }
}

/* ════════════════════ SAVINGS GOALS ════════════════════ */
function estCompletion(goal) {
  if (!goal.target || goal.target <= 0) return 'Set a target';
  if (goal.saved >= goal.target) return '✦ COMPLETE! ✦';
  if (!goal.contribution || goal.contribution <= 0) return 'Add contribution';
  const monthsNeeded = Math.ceil((goal.target - goal.saved) / goal.contribution);
  const d = new Date();
  d.setMonth(d.getMonth() + monthsNeeded);
  return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

          <div class="goal-input-wrap"><div class="field-label">Saved ($)</div><input type="number" value="${g.saved||''}" placeholder="0" oninput="updateGoal(${i},'saved',this.value)"></div>

function updateGoal(i, field, val) {
  state.goals[i][field] = val;
  save();
  renderGoals();
}
function addGoal() {
  const name = prompt('New goal name:');
  if (!name || !name.trim()) return;
  state.goals.push({ name: name.trim(), target: 0, saved: 0, contribution: 0 });
  save();
  renderGoals();
}
function deleteGoal(i) {
  state.goals.splice(i, 1);
  save();
  renderGoals();
}

/* ════════════════════ DEBT TRACKER ════════════════════ */
function debtPayoffInfo(d) {
  const totalMonthly = (Number(d.minPayment)||0) + (Number(d.extraPayment)||0);
  const balance = Number(d.balance) || 0;
  const apr = Number(d.apr) || 0;
  const monthlyInterest = balance * (apr/100) / 12;
  if (balance <= 0) return { label: 'Paid Off ✦', cls: 'paid', totalMonthly };
  if (totalMonthly <= 0) return { label: 'Add payment', cls: 'warn', totalMonthly };
  if (totalMonthly <= monthlyInterest) return { label: '⚠ Increase payment!', cls: 'warn', totalMonthly };
  const monthsToPayoff = Math.ceil(balance / (totalMonthly - monthlyInterest));
  const d2 = new Date();
  d2.setMonth(d2.getMonth() + monthsToPayoff);
  return { label: d2.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }), cls: 'normal', totalMonthly };
}

function sortedDebtIndices() {
  const indices = state.debts.map((_, i) => i).filter(i => state.debts[i].balance > 0);
  const paidIndices = state.debts.map((_, i) => i).filter(i => !(state.debts[i].balance > 0));
  if (currentStrategy === 'avalanche') {
    indices.sort((a, b) => (Number(state.debts[b].apr)||0) - (Number(state.debts[a].apr)||0));
  } else {
    indices.sort((a, b) => (Number(state.debts[a].balance)||0) - (Number(state.debts[b].balance)||0));
  }
  return [...indices, ...paidIndices];
}

function renderDebt() {
  document.getElementById('nav-month-pill').textContent = MONTH_NAME_FULL(currentMonthIdx);
  const totalDebt = state.debts.reduce((a,d) => a + (Number(d.balance)||0), 0);
  const totalMin = state.debts.reduce((a,d) => a + (Number(d.minPayment)||0), 0);
  const totalMonthly = state.debts.reduce((a,d) => a + (Number(d.minPayment)||0) + (Number(d.extraPayment)||0), 0);

  const screen = document.getElementById('screen-debt');
  screen.innerHTML = `
    <div class="section-label">Payoff strategy</div>
    <div class="strategy-toggle">
      <button class="strategy-btn ${currentStrategy === 'avalanche' ? 'active' : ''}" onclick="setStrategy('avalanche')">⚔️ Avalanche<br><span style="font-size:10px; opacity:0.7;">Highest rate first</span></button>
      <button class="strategy-btn ${currentStrategy === 'snowball' ? 'active' : ''}" onclick="setStrategy('snowball')">❄️ Snowball<br><span style="font-size:10px; opacity:0.7;">Lowest balance first</span></button>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div class="summary-row" style="border-top:none; padding-top:0;"><span class="summary-label">Total Debt</span><span class="summary-val">${fmt(totalDebt)}</span></div>
      <div class="summary-row"><span class="summary-label">Min Payments</span><span class="summary-val">${fmt(totalMin)}</span></div>
      <div class="summary-row"><span class="summary-label">Total Monthly</span><span class="summary-val">${fmt(totalMonthly)}</span></div>
    </div>

    <div class="section-label">Your debts — ${currentStrategy === 'avalanche' ? 'highest rate first' : 'lowest balance first'}</div>
    <div id="debt-list"></div>
    <button class="add-btn" onclick="addDebt()">+ Add a debt</button>
  `;

  const order = sortedDebtIndices();
  const list = document.getElementById('debt-list');
  list.innerHTML = order.map((i, rank) => {
    const d = state.debts[i];
    const info = debtPayoffInfo(d);
    const isActive = d.balance > 0;
    return `
      <div class="card debt-card">
        ${isActive ? `<div class="debt-rank">${rank+1}</div>` : ''}
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="debt-name">${d.name}</span>
          <button class="li-del" onclick="deleteDebt(${i})">✕</button>
        </div>
        <div class="debt-inputs">
          <div class="goal-input-wrap"><div class="field-label">Balance ($)</div><input type="number" value="${d.balance||''}" placeholder="0" oninput="updateDebt(${i},'balance',this.value)"></div>
          <div class="goal-input-wrap"><div class="field-label">APR (%)</div><input type="number" value="${d.apr||''}" placeholder="0" oninput="updateDebt(${i},'apr',this.value)"></div>
          <div class="goal-input-wrap"><div class="field-label">Min Payment ($)</div><input type="number" value="${d.minPayment||''}" placeholder="0" oninput="updateDebt(${i},'minPayment',this.value)"></div>
          <div class="goal-input-wrap"><div class="field-label">Extra Payment ($)</div><input type="number" value="${d.extraPayment||''}" placeholder="0" oninput="updateDebt(${i},'extraPayment',this.value)"></div>
        </div>
        <div class="debt-payoff-badge ${info.cls}">${info.label}</div>
        <span style="font-size:11px; color:var(--text-mid); margin-left:8px;">${fmt(info.totalMonthly)}/mo</span>
      </div>`;
  }).join('');
}

function setStrategy(s) { currentStrategy = s; save(); renderDebt(); }
function updateDebt(i, field, val) { state.debts[i][field] = val; save(); renderDebt(); }
function addDebt() {
  const name = prompt('New debt name:');
  if (!name || !name.trim()) return;
  state.debts.push({ name: name.trim(), balance: 0, apr: 0, minPayment: 0, extraPayment: 0 });
  save();
  renderDebt();
}
function deleteDebt(i) {
  state.debts.splice(i, 1);
  // unlink bills pointed at the deleted debt, re-index bills pointed at debts after it
  state.bills.forEach(b => {
    if (b.linkedDebt === i) b.linkedDebt = null;
    else if (b.linkedDebt != null && b.linkedDebt > i) b.linkedDebt -= 1;
  });
  save();
  renderDebt();
}

/* ════════════════════ BILL CALENDAR ════════════════════ */
function billStatusComputed(b) {
  if (b.status === 'paid') return 'paid';
  const due = new Date(b.dueDate);
  const today = new Date();
  if (b.autopay && due <= today) return 'paid';
  if (b.autopay) return 'pending';
  return 'unpaid';
}

function renderBills() {
  document.getElementById('nav-month-pill').textContent = MONTH_NAME_FULL(currentMonthIdx);
  const totalMonthly = state.bills.reduce((a,b) => a + (Number(b.amount)||0), 0);
  const today = new Date();
  const in7 = new Date(); in7.setDate(in7.getDate() + 7);
  const dueSoon = state.bills.filter(b => {
    const d = new Date(b.dueDate);
    return d >= today && d <= in7 && billStatusComputed(b) === 'unpaid';
  }).length;
  const paidCount = state.bills.filter(b => billStatusComputed(b) !== 'unpaid').length;

  const sorted = [...state.bills].sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

  const screen = document.getElementById('screen-bills');
  screen.innerHTML = `
    <div class="${dueSoon > 0 ? 'alert-banner' : 'alert-banner calm'}">
      ${dueSoon > 0 ? `✦ ${dueSoon} bill${dueSoon>1?'s':''} due in the next 7 days` : '✦ Nothing urgent — all caught up'}
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div class="summary-row" style="border-top:none; padding-top:0;"><span class="summary-label">Total Monthly Bills</span><span class="summary-val">${fmt(totalMonthly)}</span></div>
      <div class="summary-row"><span class="summary-label">Paid / Total</span><span class="summary-val">${paidCount} of ${state.bills.length}</span></div>
    </div>

    <div class="section-label">All bills</div>
    <div class="card" id="bills-card">
      <div id="bills-list"></div>
    </div>
    <button class="add-btn" onclick="addBill()">+ Add a bill</button>
  `;

  const list = document.getElementById('bills-list');
  list.innerHTML = sorted.map(b => {
    const idx = state.bills.indexOf(b);
    const status = billStatusComputed(b);
    const d = new Date(b.dueDate);
    const linkedDebt = (b.linkedDebt != null && state.debts[b.linkedDebt]) ? state.debts[b.linkedDebt] : null;
    const debtTag = linkedDebt
      ? `<span class="debt-link-tag">⚔️ ${fmt(linkedDebt.balance)} remaining on ${linkedDebt.name}</span>`
      : '';
    return `
      <div class="bill-row">
        <div class="bill-status-dot ${status}"></div>
        <div class="bill-info">
          <div class="bill-name-txt">${b.name}</div>
          <div class="bill-meta-txt">${b.category} · ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${b.frequency}${b.autopay ? ' · Auto-pay' : ''}</div>
          ${debtTag}
        </div>
        <div class="bill-amt">${fmt(b.amount)}</div>
        <button class="bill-status-toggle ${status === 'paid' ? 'paid' : 'unpaid'}" onclick="toggleBillStatus(${idx})">${status === 'paid' ? 'Paid' : 'Mark paid'}</button>
        <button class="li-del" onclick="openBillEditor(${idx})">✎</button>
      </div>`;
  }).join('');
}

function toggleBillStatus(i) {
  const b = state.bills[i];
  b.status = b.status === 'paid' ? 'unpaid' : 'paid';
  save();
  renderBills();
}

function openBillEditor(i) {
  modalCtx = i;
  pendingModal = 'editbill';
  const b = state.bills[i];
  document.getElementById('modal-title').textContent = 'Edit bill';
  document.getElementById('modal-sub').textContent = 'Update details, due date, or delete this bill.';
  document.getElementById('modal-body').innerHTML = `
    <div class="field-wrap"><div class="field-label">Name</div><input type="text" id="eb-name" value="${b.name}"></div>
    <div class="field-wrap"><div class="field-label">Amount ($)</div><input type="number" id="eb-amount" value="${b.amount||''}"></div>
    <div class="field-wrap"><div class="field-label">Next Due Date</div><input type="date" id="eb-date" value="${b.dueDate}"></div>
    <div class="field-wrap"><div class="field-label">Category</div><input type="text" id="eb-category" value="${b.category}"></div>
    <div class="field-wrap"><div class="field-label">Frequency</div>
      <select id="eb-freq">
        ${['Monthly','Annual','Semi-Annual','Weekly','Bi-Weekly'].map(f => `<option ${b.frequency===f?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
    <div class="field-wrap"><div class="field-label">Auto-Pay?</div>
      <select id="eb-autopay">
        <option value="false" ${!b.autopay?'selected':''}>No</option>
        <option value="true" ${b.autopay?'selected':''}>Yes</option>
      </select>
    </div>
    <div class="field-wrap"><div class="field-label">Linked debt (optional)</div>
      <select id="eb-linkeddebt">
        <option value="" ${b.linkedDebt==null?'selected':''}>None — not tied to a debt</option>
        ${state.debts.map((d,di) => `<option value="${di}" ${b.linkedDebt===di?'selected':''}>${d.name} (${fmt(d.balance)} remaining)</option>`).join('')}
      </select>
    </div>
    <button class="reset-btn danger" onclick="deleteBillFromModal(${i})" style="margin-top:6px;">🗑 Delete this bill</button>
  `;
  document.getElementById('modal-confirm-btn').textContent = 'Save';
  document.getElementById('modal').classList.add('show');
}

function deleteBillFromModal(i) {
  state.bills.splice(i, 1);
  save();
  closeModal();
  renderBills();
}

function addBill() {
  const name = prompt('New bill name:');
  if (!name || !name.trim()) return;
  state.bills.push({ name: name.trim(), amount: 0, frequency: 'Monthly', dueDate: new Date().toISOString().slice(0,10), category: 'Other', autopay: false, status: 'unpaid', linkedDebt: null });
  save();
  renderBills();
}

/* ════════════════════ SETTINGS ════════════════════ */
function renderSettings() {
  document.getElementById('nav-month-pill').textContent = MONTH_NAME_FULL(currentMonthIdx);
  const screen = document.getElementById('screen-settings');
  screen.innerHTML = `
    <div class="section-label">Reset options</div>
    <div class="card">
      <div class="card-title">Manage your data</div>
      <div class="card-sub">All data is stored privately on this device. Nothing is sent anywhere.</div>
      <button class="reset-btn" onclick="openModal('clearmonth')">📋 Clear a specific month's budget…</button>
      <button class="reset-btn" onclick="openModal('clearbills')">🗓️ Reset all bill statuses to unpaid</button>
      <button class="reset-btn danger" onclick="openModal('all')">⚠️ Wipe everything &amp; start fresh</button>
    </div>
    <div class="section-label">About</div>
    <div class="card">
      <div class="card-title">Golden Ledger</div>
      <div class="card-sub" style="margin-bottom:0;">Your personal treasury — income, expenses, goals, debt, and bills in one place. Personal use. All entries are saved locally on your device and never shared.</div>
    </div>
  `;
}

/* ════════════════════ MODAL DISPATCHER ════════════════════ */
function openModal(type) {
  pendingModal = type;
  modalCtx = null;
  const title = document.getElementById('modal-title');
  const sub = document.getElementById('modal-sub');
  const body = document.getElementById('modal-body');
  document.getElementById('modal-confirm-btn').textContent = 'Confirm';

  if (type === 'clearmonth') {
    title.textContent = 'Clear a month';
    sub.textContent = 'Select which month\'s budget to clear. Income and expense entries for that month will be deleted.';
    body.innerHTML = `<select id="clear-month-select">${MONTH_NAMES.map((n,i) => `<option value="${i}">${n}</option>`).join('')}</select>`;
  } else if (type === 'clearbills') {
    title.textContent = 'Reset bill statuses?';
    sub.textContent = 'All bills will be marked unpaid again. Amounts and due dates stay the same.';
    body.innerHTML = '';
  } else if (type === 'all') {
    title.textContent = 'Wipe everything?';
    sub.textContent = 'This permanently deletes all months, goals, debts, and bills. There is no undo.';
    body.innerHTML = '';
  }
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  pendingModal = ''; modalCtx = null;
}

function doModal() {
  if (pendingModal === 'clearmonth') {
    const idx = Number(document.getElementById('clear-month-select').value);
    state.months[MONTHS[idx]] = { income: {}, expenses: {} };
    save();
    toast(MONTH_NAMES[idx] + ' budget cleared ✓');
  } else if (pendingModal === 'clearbills') {
    state.bills.forEach(b => b.status = 'unpaid');
    save();
    toast('Bill statuses reset ✓');
    renderBills();
  } else if (pendingModal === 'all') {
    localStorage.removeItem('golden_ledger');
    load();
    toast('Fresh start ✦');
    showScreen('dashboard');
  } else if (pendingModal === 'editbill') {
    const i = modalCtx;
    const b = state.bills[i];
    b.name = document.getElementById('eb-name').value || b.name;
    b.amount = document.getElementById('eb-amount').value;
    b.dueDate = document.getElementById('eb-date').value;
    b.category = document.getElementById('eb-category').value;
    b.frequency = document.getElementById('eb-freq').value;
    b.autopay = document.getElementById('eb-autopay').value === 'true';
    const linkedVal = document.getElementById('eb-linkeddebt').value;
    b.linkedDebt = linkedVal === '' ? null : Number(linkedVal);
    save();
    toast('Bill updated ✓');
    renderBills();
  }
  closeModal();
}

/* ════════════════════ INIT ════════════════════ */
load();
document.getElementById('nav-month-pill').textContent = MONTH_NAME_FULL(currentMonthIdx);
document.getElementById('tab-dashboard').classList.add('active');
renderDashboard();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
